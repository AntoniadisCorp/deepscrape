<div
  class="max-w-screen-md mx-auto bg-white dark:bg-gray6 rounded-lg shadow-lg p-10"
  >
  <div class="flex justify-between items-center mb-4">
    <h2
      class="text-lg font-bold from-pink-400 to-deep-purple-600 bg-gradient-to-r dark:from-pink-400 dark:to-deep-purple-400 bg-clip-text text-transparent"
      >
      {{ 'PAYMENT.CARD_TITLE' | translate }}
    </h2>
  </div>
  <form [formGroup]="checkoutForm" (submit)="collectPayment($event)">
    <div class="flex flex-wrap -mx-3 mb-6">
      <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
        <label
          class="block uppercase tracking-wide text-gray-700 dark:text-gray-100 text-xs font-bold mb-2"
          for="name"
          >
          {{ 'PAYMENT.NAME' | translate }}
        </label>
        <input
          class="appearance-none block w-full bg-gray-200 text-gray-700 dark:bg-gray6 dark:text-gray-100 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none dark:focus:bg-gray5 focus:bg-white"
          type="text"
          formControlName="name"
          placeholder="{{ 'PAYMENT.NAME' | translate }}"
          />
        </div>
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
          <label
            class="block uppercase tracking-wide text-gray-700 dark:text-gray-100 text-xs font-bold mb-2"
            for="email"
            >
            {{ 'PAYMENT.EMAIL' | translate }}
          </label>
          <input
            class="appearance-none block w-full bg-gray-200 text-gray-700 dark:bg-gray6 dark:text-gray-100 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none dark:focus:bg-gray5 focus:bg-white"
            type="email"
            formControlName="email"
            placeholder="{{ 'PAYMENT.EMAIL' | translate }}"
            />
          </div>
        </div>
        <div class="flex flex-wrap -mx-3 mb-6">
          <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
            <label
              class="block uppercase tracking-wide text-gray-700 dark:text-gray-100 text-xs font-bold mb-2"
              for="address"
              >
              {{ 'PAYMENT.ADDRESS' | translate }}
            </label>
            <input
              class="appearance-none block w-full bg-gray-200 text-gray-700 dark:bg-gray6 dark:text-gray-100 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none dark:focus:bg-gray5 focus:bg-white"
              type="text"
              formControlName="address"
              placeholder="{{ 'PAYMENT.ADDRESS' | translate }}"
              />
            </div>
          </div>
          <div class="flex flex-wrap -mx-3 mb-6">
            <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
              <label
                class="block uppercase tracking-wide text-gray-700 dark:text-gray-100 text-xs font-bold mb-2"
                for="zipcode"
                >
                {{ 'PAYMENT.ZIP' | translate }}
              </label>
              <input
                class="appearance-none block w-full bg-gray-200 text-gray-700 dark:bg-gray6 dark:text-gray-100 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none dark:focus:bg-gray5 focus:bg-white"
                type="text"
                formControlName="zipcode"
                placeholder="{{ 'PAYMENT.ZIP' | translate }}"
                />
              </div>
              <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
                <label
                  class="block uppercase tracking-wide text-gray-700 dark:text-gray-100 text-xs font-bold mb-2"
                  for="city"
                  >
                  {{ 'PAYMENT.CITY' | translate }}
                </label>
                <input
                  class="appearance-none block w-full bg-gray-200 text-gray-700 dark:bg-gray6 dark:text-gray-100 border rounded py-3 px-4 mb-3 leading-tight focus:outline-none dark:focus:bg-gray5 focus:bg-white"
                  type="text"
                  formControlName="city"
                  placeholder="{{ 'PAYMENT.CITY' | translate }}"
                  />
                </div>
              </div>
              <div class="mb-2"></div>
              <div #cardForm>
                @if (elementsOptions.clientSecret) {
                  <ngx-stripe-elements
                    [stripe]="stripe"
                    [elementsOptions]="elementsOptions"
                    >
                    <ngx-stripe-payment [options]="paymentElementOptions" />
                  </ngx-stripe-elements>
                }
              </div>

              <div class="mb-5"></div>
              <hr class="my-10" />
              <div class="flex justify-end gap-2">
                <button
                  type="reset"
                  class="bg-gray-500 hover:bg-gray-700 dark:bg-gray6 dark:hover:bg-gray5 text-white font-bold py-2 px-4 rounded"
                  [disabled]="paying()"
                  (click)="clear()"
                  >
                  {{ 'PAYMENT.CLEAR' | translate }}
                </button>
                <button
                  type="submit"
                  class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
                  [disabled]="paying()"
                  >
                  @if (paying()) {
                    <span>{{ 'PAYMENT.PROCESSING' | translate }}</span>
                  }
                  @if (!paying()) {
                    <span
                      >{{ 'PAYMENT.PAY' | translate }}
                      @if (amount) {
                        <span>{{ amount | currency }}</span>
                      }
                    </span>
                  }
                </button>
              </div>
            </form>
          </div>
