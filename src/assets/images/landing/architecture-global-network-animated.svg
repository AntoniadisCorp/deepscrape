<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="g-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#176ab1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="g-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be123c"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-lg"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="600" fill="#060606" rx="16"/>

  <!-- Grid overlay -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="0.5"/><line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/><line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5"/><line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Decorative orbs -->
  <circle cx="200" cy="150" r="180" fill="rgba(23,106,177,0.08)" filter="url(#glow-lg)">
    <animate attributeName="r" values="180;200;180" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="400" r="150" fill="rgba(190,18,60,0.06)" filter="url(#glow-lg)">
    <animate attributeName="r" values="150;170;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Globe outline -->
  <ellipse cx="600" cy="300" rx="350" ry="200" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <ellipse cx="600" cy="300" rx="350" ry="200" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5" transform="rotate(-15,600,300)"/>

  <!-- Connection lines between nodes -->
  <g stroke="url(#g-cyan)" stroke-width="1" opacity="0.3" fill="none">
    <path d="M200,200 L400,150 L600,250 L800,180 L1000,220">
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M200,200 L350,400 L600,350 L850,420 L1000,220" stroke="url(#g-rose)" opacity="0.2">
      <animate attributeName="stroke-dashoffset" values="0;-250" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M400,150 L600,350" stroke="rgba(255,255,255,0.1)" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M800,180 L600,350" stroke="rgba(255,255,255,0.1)" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Glass Node: Americas -->
  <g>
    <circle cx="200" cy="200" r="40" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="8" fill="#06b6d4" opacity="0.6">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="255" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Americas</text>
    <rect x="155" y="125" width="90" height="20" rx="6" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
    <text x="200" y="139" text-anchor="middle" fill="#06b6d4" font-size="8" font-family="sans-serif" opacity="0.8">⚡ 3 regions</text>
  </g>

  <!-- Glass Node: Europe -->
  <g>
    <circle cx="400" cy="150" r="35" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
    <circle cx="400" cy="150" r="7" fill="#06b6d4" opacity="0.5">
      <animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="200" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Europe</text>
    <rect x="355" y="75" width="90" height="20" rx="6" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
    <text x="400" y="89" text-anchor="middle" fill="#06b6d4" font-size="8" font-family="sans-serif">⚡ 5 regions</text>
  </g>

  <!-- Glass Node: Africa -->
  <g>
    <circle cx="350" cy="400" r="30" fill="rgba(255,255,255,0.04)" stroke="rgba(244,63,94,0.25)" stroke-width="1.5"/>
    <circle cx="350" cy="400" r="6" fill="#f43f5e" opacity="0.5">
      <animate attributeName="r" values="6;10;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="350" y="445" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Africa</text>
    <rect x="305" y="325" width="90" height="20" rx="6" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.2)" stroke-width="0.5"/>
    <text x="350" y="339" text-anchor="middle" fill="#f43f5e" font-size="8" font-family="sans-serif">⚡ 2 regions</text>
  </g>

  <!-- Glass Node: Asia -->
  <g>
    <circle cx="600" cy="250" r="45" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>
    <circle cx="600" cy="250" r="10" fill="#06b6d4" opacity="0.7">
      <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="310" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Asia</text>
    <rect x="555" y="175" width="90" height="20" rx="6" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5"/>
    <text x="600" y="189" text-anchor="middle" fill="#06b6d4" font-size="8" font-family="sans-serif">⚡ 8 regions</text>
  </g>

  <!-- Glass Node: Middle East -->
  <g>
    <circle cx="800" cy="180" r="30" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.25)" stroke-width="1.5"/>
    <circle cx="800" cy="180" r="6" fill="#06b6d4" opacity="0.5">
      <animate attributeName="r" values="6;9;6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="225" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Middle East</text>
  </g>

  <!-- Glass Node: Oceania -->
  <g>
    <circle cx="1000" cy="220" r="35" fill="rgba(255,255,255,0.04)" stroke="rgba(244,63,94,0.25)" stroke-width="1.5"/>
    <circle cx="1000" cy="220" r="7" fill="#f43f5e" opacity="0.5">
      <animate attributeName="r" values="7;11;7" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="270" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="sans-serif" font-weight="600">Oceania</text>
    <rect x="955" y="140" width="90" height="20" rx="6" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.2)" stroke-width="0.5"/>
    <text x="1000" y="154" text-anchor="middle" fill="#f43f5e" font-size="8" font-family="sans-serif">⚡ 2 regions</text>
  </g>

  <!-- Glass Node: Central Asia Hub -->
  <g>
    <circle cx="600" cy="400" r="25" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="600" cy="400" r="5" fill="white" opacity="0.3">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="440" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="9" font-family="sans-serif">Central Hub</text>
  </g>

  <!-- Bottom legend bar -->
  <rect x="300" y="500" width="600" height="40" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <circle cx="340" cy="520" r="4" fill="#06b6d4"/>
  <text x="350" y="524" fill="rgba(255,255,255,0.5)" font-size="10" font-family="sans-serif">Active Node</text>
  <circle cx="450" cy="520" r="4" fill="#f43f5e"/>
  <text x="460" y="524" fill="rgba(255,255,255,0.5)" font-size="10" font-family="sans-serif">Edge Node</text>
  <circle cx="560" cy="520" r="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="570" y="524" fill="rgba(255,255,255,0.5)" font-size="10" font-family="sans-serif">Data Flow</text>
  <text x="780" y="524" fill="rgba(255,255,255,0.4)" font-size="9" font-family="sans-serif">🌍 40+ Countries • ⚡ &lt;200ms Avg</text>

  <!-- Top badges -->
  <rect x="460" y="20" width="120" height="26" rx="8" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.2)" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;1;1" dur="3s" fill="freeze"/>
  </rect>
  <text x="520" y="37" text-anchor="middle" fill="#06b6d4" font-size="10" font-family="sans-serif" font-weight="600">🌍 Global Network</text>

  <rect x="590" y="20" width="120" height="26" rx="8" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.2)" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;1;1" dur="3s" fill="freeze"/>
  </rect>
  <text x="650" y="37" text-anchor="middle" fill="#f43f5e" font-size="10" font-family="sans-serif" font-weight="600">🛡️ Anti-Detection</text>
</svg>
