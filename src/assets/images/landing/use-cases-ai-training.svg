<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#be123c"/><stop offset="100%" style="stop-color:#f43f5e"/></linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#176ab1"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="#060606" rx="12"/>
  <g opacity="0.025">
    <line x1="0" y1="80" x2="600" y2="80" stroke="white" stroke-width="0.5"/><line x1="0" y1="160" x2="600" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="white" stroke-width="0.5"/><line x1="0" y1="320" x2="600" y2="320" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Large Lucide-style brain / neural node (center focal) -->
  <g transform="translate(300,160)" opacity="0">
    <animate attributeName="opacity" values="0;0.85" dur="1.2s" fill="freeze"/>
    <!-- Brain outline -->
    <path d="M-40,-50 C-80,-60 -90,-10 -50,10 C-70,40 -30,65 0,40 C30,65 70,40 50,10 C90,-10 80,-60 40,-50 C20,-70 -20,-70 -40,-50Z" fill="none" stroke="url(#gr)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Neural connections inside -->
    <circle cx="-20" cy="-15" r="4" fill="#06b6d4"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="-15" r="4" fill="rgba(6,182,212,0.6)"><animate attributeName="r" values="4;6;4" dur="2.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="15" r="4" fill="rgba(244,63,94,0.6)"><animate attributeName="r" values="4;6;4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
    <line x1="-20" y1="-15" x2="0" y2="15" stroke="rgba(244,63,94,0.15)" stroke-width="1"/>
    <line x1="20" y1="-15" x2="0" y2="15" stroke="rgba(244,63,94,0.15)" stroke-width="1"/>
  </g>

  <!-- Floating capability chips -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="1.8s" fill="freeze"/>
    <rect x="50" y="60" width="120" height="28" rx="14" fill="rgba(244,63,94,0.06)" stroke="rgba(244,63,94,0.12)" stroke-width="0.5"/>
    <text x="110" y="78" text-anchor="middle" fill="rgba(244,63,94,0.6)" font-size="11" font-family="sans-serif" font-weight="600">LLM training data</text>
    <rect x="430" y="60" width="120" height="28" rx="14" fill="rgba(6,182,212,0.05)" stroke="rgba(6,182,212,0.1)" stroke-width="0.5"/>
    <text x="490" y="78" text-anchor="middle" fill="rgba(6,182,212,0.55)" font-size="11" font-family="sans-serif" font-weight="600">RAG pipelines</text>
    <rect x="60" y="280" width="130" height="28" rx="14" fill="rgba(139,92,246,0.05)" stroke="rgba(139,92,246,0.1)" stroke-width="0.5"/>
    <text x="125" y="298" text-anchor="middle" fill="rgba(139,92,246,0.5)" font-size="11" font-family="sans-serif" font-weight="600">JSON structured</text>
    <rect x="410" y="280" width="140" height="28" rx="14" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.1)" stroke-width="0.5"/>
    <text x="480" y="298" text-anchor="middle" fill="rgba(34,197,94,0.5)" font-size="11" font-family="sans-serif" font-weight="600">Clean markdown</text>
  </g>

  <!-- Decorative dots -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.3" dur="2.5s" fill="freeze"/>
    <circle cx="550" cy="120" r="3" fill="#f43f5e"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="200" r="2" fill="rgba(139,92,246,0.4)"><animate attributeName="r" values="2;3.5;2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="330" r="2.5" fill="rgba(6,182,212,0.3)"><animate attributeName="r" values="2.5;4.5;2.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>