<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <rect width="200" height="150" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(244,63,94,0.2)" stroke-width="1"/>
  <!-- Globe proxy icon -->
  <circle cx="48" cy="42" r="18" fill="none" stroke="rgba(244,63,94,0.2)" stroke-width="1.5">
    <animate attributeName="r" values="18;20;18" dur="3s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="48" cy="42" rx="18" ry="6" fill="none" stroke="rgba(244,63,94,0.15)" stroke-width="0.8"/>
  <line x1="30" y1="42" x2="66" y2="42" stroke="rgba(244,63,94,0.15)" stroke-width="0.8"/>
  <circle cx="30" cy="42" r="2" fill="#f43f5e">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="42" r="2" fill="#f43f5e">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="28" r="2" fill="#f43f5e"/>
  <circle cx="48" cy="56" r="2" fill="#f43f5e"/>
  <text x="50" y="90" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="13" font-family="sans-serif" font-weight="600">Proxy Rotation</text>
  <text x="50" y="108" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-family="sans-serif">Auto-rotate</text>
  <text x="50" y="122" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-family="sans-serif">IP pool</text>
</svg>