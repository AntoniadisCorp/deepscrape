<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="go" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f97316"/><stop offset="100%" style="stop-color:#f43f5e"/></linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#176ab1"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="#060606" rx="12"/>
  <g opacity="0.025">
    <line x1="0" y1="80" x2="600" y2="80" stroke="white" stroke-width="0.5"/><line x1="0" y1="160" x2="600" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="white" stroke-width="0.5"/><line x1="0" y1="320" x2="600" y2="320" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Large Lucide-style search/magnifier (center focal) -->
  <g transform="translate(300,150)" opacity="0">
    <animate attributeName="opacity" values="0;0.85" dur="1.2s" fill="freeze"/>
    <circle cx="-10" cy="-10" r="50" fill="none" stroke="url(#go)" stroke-width="2.5" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0" dur="1.5s" fill="freeze"/>
    </circle>
    <!-- Search handle -->
    <line x1="30" y1="30" x2="65" y2="65" stroke="url(#gc)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="30;35;30" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="30;35;30" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="65;70;65" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="65;70;65" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating result chips -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.55" dur="1.8s" fill="freeze"/>
    <rect x="50" y="60" width="130" height="28" rx="14" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.1)" stroke-width="0.5"/>
    <text x="115" y="78" text-anchor="middle" fill="rgba(249,115,22,0.6)" font-size="11" font-family="sans-serif" font-weight="600">#1 organic position</text>
    <rect x="420" y="60" width="120" height="28" rx="14" fill="rgba(6,182,212,0.05)" stroke="rgba(6,182,212,0.1)" stroke-width="0.5"/>
    <text x="480" y="78" text-anchor="middle" fill="rgba(6,182,212,0.55)" font-size="11" font-family="sans-serif" font-weight="600">87/100 CWV score</text>
    <rect x="60" y="280" width="140" height="28" rx="14" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.1)" stroke-width="0.5"/>
    <text x="130" y="298" text-anchor="middle" fill="rgba(34,197,94,0.5)" font-size="11" font-family="sans-serif" font-weight="600">✓ Schema valid</text>
    <rect x="400" y="280" width="150" height="28" rx="14" fill="rgba(249,115,22,0.05)" stroke="rgba(249,115,22,0.1)" stroke-width="0.5"/>
    <text x="475" y="298" text-anchor="middle" fill="rgba(249,115,22,0.5)" font-size="11" font-family="sans-serif" font-weight="600">🔗 1,247 backlinks</text>
  </g>

  <!-- Decorative dots -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.3" dur="2.5s" fill="freeze"/>
    <circle cx="550" cy="140" r="3" fill="#f97316"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="180" r="2" fill="rgba(6,182,212,0.4)"><animate attributeName="r" values="2;3.5;2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="340" r="2.5" fill="rgba(249,115,22,0.3)"><animate attributeName="r" values="2.5;4.5;2.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>