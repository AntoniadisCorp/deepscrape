<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="p-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="p-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185"/>
      <stop offset="100%" style="stop-color:#be123c"/>
    </linearGradient>
    <radialGradient id="p-orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(34,211,238,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(34,211,238,0)"/>
    </radialGradient>
    <radialGradient id="p-orb-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(251,113,133,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(251,113,133,0)"/>
    </radialGradient>
    <radialGradient id="p-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(6,182,212,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(6,182,212,0)"/>
    </radialGradient>
    <filter id="glowS" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#060607"/>

  <!-- Ambient color fields (research-lab) -->
  <circle cx="1020" cy="90" r="320" fill="url(#p-orb-cyan)" filter="url(#softBlur)" opacity="0.55">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="430" r="330" fill="url(#p-orb-rose)" filter="url(#softBlur)" opacity="0.5">
    <animate attributeName="opacity" values="0.38;0.55;0.38" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="240" r="220" fill="url(#p-orb-rose)" filter="url(#softBlur)" opacity="0.16"/>

  <!-- Faint grid -->
  <g opacity="0.04">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M100 0V500M250 0V500M400 0V500M550 0V500M700 0V500M850 0V500M1000 0V500M1150 0V500" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- "Web rain" data particles drifting down -->
  <g opacity="0.5">
    <g><line x1="170" y1="-20" x2="170" y2="40" stroke="rgba(34,211,238,0.5)" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="7s" repeatCount="indefinite"/></g>
    <g><line x1="330" y1="-30" x2="330" y2="30" stroke="rgba(34,211,238,0.35)" stroke-width="0.8"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="9s" repeatCount="indefinite" begin="1.2s"/></g>
    <g><line x1="520" y1="-20" x2="520" y2="30" stroke="rgba(251,113,133,0.35)" stroke-width="0.8"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="8s" repeatCount="indefinite" begin="0.6s"/></g>
    <g><line x1="760" y1="-30" x2="760" y2="30" stroke="rgba(34,211,238,0.3)" stroke-width="0.8"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="10s" repeatCount="indefinite" begin="2s"/></g>
    <g><line x1="940" y1="-20" x2="940" y2="34" stroke="rgba(251,113,133,0.4)" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="6.5s" repeatCount="indefinite" begin="0.9s"/></g>
    <g><line x1="1090" y1="-30" x2="1090" y2="26" stroke="rgba(34,211,238,0.4)" stroke-width="0.9"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="8.5s" repeatCount="indefinite" begin="1.7s"/></g>
    <g><circle cx="60" cy="-6" r="1.5" fill="#22d3ee"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="11s" repeatCount="indefinite" begin="0.3s"/></g>
    <g><circle cx="1180" cy="-6" r="1.5" fill="#fb7185"/><animateTransform attributeName="transform" type="translate" values="0 0;0 520" dur="9.5s" repeatCount="indefinite" begin="1.4s"/></g>
  </g>

  <!-- Connector arcs between hubs -->
  <g fill="none">
    <path d="M170 250 C 320 130, 470 380, 610 250" stroke="url(#p-cyan)" stroke-width="1.2" opacity="0.28"/>
    <path d="M610 250 C 740 130, 860 360, 1000 250" stroke="url(#p-rose)" stroke-width="1.2" opacity="0.28"/>
    <path d="M170 250 C 320 400, 480 90, 610 250" stroke="url(#p-rose)" stroke-width="1" opacity="0.16"/>
    <path d="M610 250 C 760 380, 900 120, 1000 250" stroke="url(#p-cyan)" stroke-width="1" opacity="0.16"/>
  </g>

  <!-- Energy dash flow along the main arcs -->
  <path d="M170 250 C 320 130, 470 380, 610 250" fill="none" stroke="rgba(34,211,238,0.5)" stroke-width="1.6">
    <animate attributeName="stroke-dasharray" values="0 400;240 400" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M610 250 C 740 130, 860 360, 1000 250" fill="none" stroke="rgba(251,113,133,0.5)" stroke-width="1.6">
    <animate attributeName="stroke-dasharray" values="0 400;240 400" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </path>

  <!-- Traveling packets -->
  <g>
    <circle r="3.5" fill="#22d3ee" filter="url(#glowS)"/>
    <animateMotion dur="4s" repeatCount="indefinite" path="M170 250 C 320 130, 470 380, 610 250"/>
  </g>
  <g>
    <circle r="2.5" fill="#fb7185" filter="url(#glowS)"/>
    <animateMotion dur="4.6s" repeatCount="indefinite" begin="1.2s" path="M170 250 C 320 130, 470 380, 610 250"/>
  </g>
  <g>
    <circle r="3.5" fill="#fb7185" filter="url(#glowS)"/>
    <animateMotion dur="4s" repeatCount="indefinite" begin="0.4s" path="M610 250 C 740 130, 860 360, 1000 250"/>
  </g>
  <g>
    <circle r="2.6" fill="#22d3ee" filter="url(#glowS)"/>
    <animateMotion dur="5s" repeatCount="indefinite" begin="2s" path="M610 250 C 740 130, 860 360, 1000 250"/>
  </g>

  <!-- Hub: entry node -->
  <g>
    <circle cx="170" cy="250" r="26" fill="url(#p-glow)" opacity="0.6"/>
    <circle cx="170" cy="250" r="11" fill="rgba(6,182,212,0.14)" stroke="#22d3ee" stroke-width="1.4">
      <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="250" r="4" fill="#67e8f9" filter="url(#glowS)"/>
  </g>

  <!-- Hub: compute center -->
  <g>
    <circle cx="610" cy="250" r="34" fill="url(#p-glow)" opacity="0.7"/>
    <circle cx="610" cy="250" r="16" fill="rgba(244,63,94,0.12)" stroke="#fb7185" stroke-width="1.5">
      <animate attributeName="r" values="15;19;15" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="250" r="5.5" fill="#fda4af" filter="url(#glowS)"/>
    <circle cx="610" cy="250" r="34" fill="none" stroke="rgba(251,113,133,0.35)" stroke-width="1" stroke-dasharray="4 60">
      <animateTransform attributeName="transform" type="rotate" from="0 610 250" to="360 610 250" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hub: structured-data node (JSON glyphs, no text) -->
  <g>
    <circle cx="1000" cy="250" r="40" fill="url(#p-glow)" opacity="0.7"/>
    <circle cx="1000" cy="250" r="20" fill="rgba(6,182,212,0.1)" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r" values="19;23;19" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#67e8f9" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M984 240 h7 M991 240 v13 M984 253 h7"/>
      <path d="M1004 244 h13 M1004 250 h9"/>
    </g>
    <g stroke="#fda4af" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M1012 262 h11"/>
    </g>
  </g>

  <!-- Small satellite nodes -->
  <g opacity="0.8">
    <circle cx="380" cy="150" r="4" fill="#67e8f9" filter="url(#glowS)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="360" r="4" fill="#fda4af" filter="url(#glowS)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="760" cy="150" r="4" fill="#fda4af" filter="url(#glowS)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="830" cy="355" r="4" fill="#67e8f9" filter="url(#glowS)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" begin="2s"/></circle>
  </g>

  <!-- Bottom fade for seamless blend into section -->
  <rect x="0" y="440" width="1200" height="60" fill="#060607" opacity="0.6"/>
</svg>
