<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#176ab1"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#be123c"/><stop offset="100%" style="stop-color:#f43f5e"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="#060606" rx="12"/>
  <g opacity="0.025">
    <line x1="0" y1="80" x2="600" y2="80" stroke="white" stroke-width="0.5"/><line x1="0" y1="160" x2="600" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="white" stroke-width="0.5"/><line x1="0" y1="320" x2="600" y2="320" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Large Lucide-style shopping bag icon (center focal) -->
  <g transform="translate(300,160)" opacity="0">
    <animate attributeName="opacity" values="0;0.85" dur="1.2s" fill="freeze"/>
    <rect x="-60" y="-70" width="120" height="140" rx="16" fill="none" stroke="url(#gc)" stroke-width="2"/>
    <path d="M-60,-50 L-40,-70 L40,-70 L60,-50" fill="none" stroke="url(#gr)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="-10" x2="-25" y2="30" stroke="#06b6d4" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="-10;-5;-10" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="-20" x2="0" y2="40" stroke="rgba(6,182,212,0.4)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="-20;-15;-20" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="25" y1="-10" x2="25" y2="30" stroke="rgba(6,182,212,0.6)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="-10;-5;-10" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating price tag chips -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="1.8s" fill="freeze"/>
    <rect x="70" y="80" width="90" height="32" rx="16" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.15)" stroke-width="0.5"/>
    <text x="115" y="100" text-anchor="middle" fill="rgba(6,182,212,0.7)" font-size="12" font-family="sans-serif" font-weight="600">€12.99</text>
    <rect x="440" y="120" width="100" height="32" rx="16" fill="rgba(244,63,94,0.06)" stroke="rgba(244,63,94,0.12)" stroke-width="0.5"/>
    <text x="490" y="140" text-anchor="middle" fill="rgba(244,63,94,0.6)" font-size="12" font-family="sans-serif" font-weight="600">-23% off</text>
    <rect x="80" y="240" width="110" height="32" rx="16" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.1)" stroke-width="0.5"/>
    <text x="135" y="260" text-anchor="middle" fill="rgba(6,182,212,0.6)" font-size="12" font-family="sans-serif" font-weight="600">In Stock</text>
    <rect x="420" y="260" width="80" height="32" rx="16" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.1)" stroke-width="0.5"/>
    <text x="460" y="280" text-anchor="middle" fill="rgba(34,197,94,0.6)" font-size="12" font-family="sans-serif" font-weight="600">★ 4.8</text>
  </g>

  <!-- Decorative dots (data points) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.4" dur="2.5s" fill="freeze"/>
    <circle cx="100" cy="300" r="3" fill="#06b6d4"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="280" r="3" fill="rgba(6,182,212,0.5)"><animate attributeName="r" values="3;4.5;3" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="310" r="3" fill="rgba(244,63,94,0.5)"><animate attributeName="r" values="3;4.5;3" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="80" r="3" fill="rgba(6,182,212,0.4)"><animate attributeName="r" values="3;4.5;3" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
