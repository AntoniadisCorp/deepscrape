<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#0d9488"/></linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#176ab1"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="#060606" rx="12"/>
  <g opacity="0.025">
    <line x1="0" y1="80" x2="600" y2="80" stroke="white" stroke-width="0.5"/><line x1="0" y1="160" x2="600" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="white" stroke-width="0.5"/><line x1="0" y1="320" x2="600" y2="320" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Large Lucide-style bar chart (center focal) -->
  <g transform="translate(300,170)" opacity="0">
    <animate attributeName="opacity" values="0;0.85" dur="1.2s" fill="freeze"/>
    <!-- Axis -->
    <line x1="-140" y1="80" x2="-140" y2="-80" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <line x1="-140" y1="80" x2="140" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Bars with staggered growth animation -->
    <rect x="-110" y="60" width="28" height="20" rx="4" fill="url(#ge)">
      <animate attributeName="height" values="0;20" dur="0.8s" fill="freeze"/>
      <animate attributeName="y" values="80;60" dur="0.8s" fill="freeze"/>
    </rect>
    <rect x="-62" y="30" width="28" height="50" rx="4" fill="url(#ge)">
      <animate attributeName="height" values="0;50" dur="1s" begin="0.2s" fill="freeze"/>
      <animate attributeName="y" values="80;30" dur="1s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="-14" y="10" width="28" height="70" rx="4" fill="url(#gc)">
      <animate attributeName="height" values="0;70" dur="1.2s" begin="0.4s" fill="freeze"/>
      <animate attributeName="y" values="80;10" dur="1.2s" begin="0.4s" fill="freeze"/>
    </rect>
    <rect x="34" y="20" width="28" height="60" rx="4" fill="url(#ge)">
      <animate attributeName="height" values="0;60" dur="1.4s" begin="0.6s" fill="freeze"/>
      <animate attributeName="y" values="80;20" dur="1.4s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="82" y="-20" width="28" height="100" rx="4" fill="url(#gc)">
      <animate attributeName="height" values="0;100" dur="1.6s" begin="0.8s" fill="freeze"/>
      <animate attributeName="y" values="80;-20" dur="1.6s" begin="0.8s" fill="freeze"/>
    </rect>
    <!-- Trend line overlay -->
    <polyline points="-96,55 -48,25 0,5 48,15 96,-25" fill="none" stroke="rgba(244,63,94,0.5)" stroke-width="1.5" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" values="400;0" dur="2s" begin="1s" fill="freeze"/>
    </polyline>
  </g>

  <!-- Floating insight chips -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="2s" fill="freeze"/>
    <rect x="60" y="70" width="110" height="28" rx="14" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.12)" stroke-width="0.5"/>
    <text x="115" y="88" text-anchor="middle" fill="rgba(16,185,129,0.6)" font-size="11" font-family="sans-serif" font-weight="600">▲ +15% growth</text>
    <rect x="430" y="90" width="100" height="28" rx="14" fill="rgba(244,63,94,0.05)" stroke="rgba(244,63,94,0.1)" stroke-width="0.5"/>
    <text x="480" y="108" text-anchor="middle" fill="rgba(244,63,94,0.5)" font-size="11" font-family="sans-serif" font-weight="600">▼ -8% decline</text>
    <rect x="50" y="280" width="130" height="28" rx="14" fill="rgba(6,182,212,0.05)" stroke="rgba(6,182,212,0.1)" stroke-width="0.5"/>
    <text x="115" y="298" text-anchor="middle" fill="rgba(6,182,212,0.5)" font-size="11" font-family="sans-serif" font-weight="600">📊 Market share: 23%</text>
    <rect x="430" y="280" width="110" height="28" rx="14" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.1)" stroke-width="0.5"/>
    <text x="485" y="298" text-anchor="middle" fill="rgba(16,185,129,0.5)" font-size="11" font-family="sans-serif" font-weight="600">🌐 40+ countries</text>
  </g>

  <!-- Decorative dots -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.35" dur="2.5s" fill="freeze"/>
    <circle cx="520" cy="60" r="3" fill="#10b981"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="180" r="2" fill="rgba(16,185,129,0.4)"><animate attributeName="r" values="2;4;2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="330" r="2.5" fill="rgba(6,182,212,0.3)"><animate attributeName="r" values="2.5;4.5;2.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>